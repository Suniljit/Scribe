[project]
name = "transcribe-backend"
version = "0.1.0"
description = "Local-first meeting recorder and transcriber"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sounddevice>=0.5",
    "numpy>=2.1",
    "soundfile>=0.12",
    "whisperx>=3.3.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "ty>=0.0.65",
]

[tool.ruff]
target-version = "py311"
